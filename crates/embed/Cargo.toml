[package]
name = "codesage-embed"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
cuda = ["ort/cuda"]

[dependencies]
codesage-protocol.workspace = true
serde.workspace = true
anyhow.workspace = true
tokenizers.workspace = true
hf-hub.workspace = true
tracing.workspace = true
sha2.workspace = true
hex.workspace = true
wait-timeout = "0.2"

[target.'cfg(not(target_vendor = "apple"))'.dependencies]
# ort's default API level moved 24 -> 27 in rc.13. The runtime loaded here is
# whatever pip's onnxruntime-gpu ships (1.24.x), which does not expose API 27, so
# the level is pinned instead of following the default. `model.rs`'s
# `ort_api_floor_matches_supported_runtime` fails if the two ever drift apart.
#
# No `download-binaries`: `load-dynamic` implies `ort-sys/disable-linking`, so a
# downloaded ONNX Runtime would never be linked. It stays on the Apple target,
# which links statically. `load-dynamic` also supplies `std`, which is why the
# Apple entry names `std` and this one does not.
ort = { version = "2.0.0-rc.13", default-features = false, features = ["api-24", "copy-dylibs", "load-dynamic", "ndarray", "preload-dylibs", "tls-native", "tracing"] }

[target.'cfg(target_vendor = "apple")'.dependencies]
ort = { version = "2.0.0-rc.13", default-features = false, features = ["api-24", "copy-dylibs", "coreml", "download-binaries", "ndarray", "std", "tls-native", "tracing"] }
