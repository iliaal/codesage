[package]
name = "codesage-embed"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
cuda = ["ort/cuda"]

[dependencies]
codesage-protocol.workspace = true
serde.workspace = true
anyhow.workspace = true
tokenizers.workspace = true
hf-hub.workspace = true
tracing.workspace = true
sha2.workspace = true
hex.workspace = true
wait-timeout = "0.2"

[target.'cfg(not(target_vendor = "apple"))'.dependencies]
# ort's default API jumped from 24 to 27 in rc.13; keep CodeSage's existing
# ONNX Runtime >= 1.24 contract explicit instead of following that moving default.
ort = { version = "2.0.0-rc.13", default-features = false, features = ["api-24", "copy-dylibs", "download-binaries", "load-dynamic", "ndarray", "preload-dylibs", "tls-native", "tracing"] }

[target.'cfg(target_vendor = "apple")'.dependencies]
ort = { version = "2.0.0-rc.13", default-features = false, features = ["api-24", "copy-dylibs", "coreml", "download-binaries", "ndarray", "std", "tls-native", "tracing"] }
