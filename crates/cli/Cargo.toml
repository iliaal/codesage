[package]
name = "codesage"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "codesage"
path = "src/main.rs"

[features]
default = []
cuda = ["codesage-embed/cuda"]
coreml = ["codesage-embed/coreml"]

[dependencies]
codesage-protocol.workspace = true
codesage-parser.workspace = true
codesage-storage.workspace = true
codesage-embed.workspace = true
codesage-graph.workspace = true
codesage-features.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
toml = "1.1"
toml_edit = "0.25"
jsonc-parser = { version = "0.32", features = ["cst"] }
anyhow.workspace = true
parking_lot.workspace = true
rmcp.workspace = true
tokio.workspace = true
schemars.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
