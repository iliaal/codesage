name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag (vX.Y.Z)'
        required: true
        type: string

permissions: {}

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify tagged source
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Validate release tag
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tag must be vX.Y.Z"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y ripgrep shellcheck shfmt
      - name: Install CPU runtime for workspace tests
        run: |
          python3 -m pip install --only-binary=:all: --no-deps --target "$RUNNER_TEMP/onnxruntime" 'onnxruntime==1.24.4'
          echo "ORT_DYLIB_PATH=$RUNNER_TEMP/onnxruntime/onnxruntime/capi/libonnxruntime.so.1.24.4" >> "$GITHUB_ENV"
      - name: Expose the workspace CLI to script regressions
        run: echo "$GITHUB_WORKSPACE/target/debug" >> "$GITHUB_PATH"
      - run: bash scripts/sanity-check.sh --cuda

  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: verify
    permissions:
      contents: write # Creates the release for the pushed tag.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Resolve version from tag
        id: ver
        run: |
          tag="$RELEASE_TAG"
          version="${tag#v}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Verify tag matches workspace version
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          cargo_version="$(awk -F'"' '
            /^\[workspace\.package\]/ { in_pkg=1; next }
            /^\[/ { in_pkg=0 }
            in_pkg && /^version[[:space:]]*=/ { print $2; exit }
          ' Cargo.toml)"
          if [ "$cargo_version" != "$VERSION" ]; then
            echo "::error::Tag $TAG implies version $VERSION but Cargo.toml [workspace.package] version is ${cargo_version:-unset}. Bump Cargo.toml before tagging." >&2
            exit 1
          fi

      - name: Extract CHANGELOG section for this version
        id: notes
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          version="$VERSION"
          # Print lines between '## [VERSION]' and the next top-level '## ' heading.
          # Strip the version heading itself; release UI already shows it.
          # Skip markdown link references like '[Unreleased]: https://...' that
          # accumulate at the bottom of CHANGELOG.md and would render as raw text.
          awk -v ver="$version" '
            $0 ~ "^## \\[" ver "\\]" { found=1; next }
            found && /^## / { exit }
            found && /^\[[^]]+\]: / { next }
            found { print }
          ' CHANGELOG.md > release-notes.md

          # Trim leading and trailing blank lines for a tidier release body.
          sed -i -e '/./,$!d' -e ':a; /^\s*$/ { $d; N; ba; }' release-notes.md

          # Checked after the trim so a whitespace-only section also fails.
          if [ ! -s release-notes.md ]; then
            echo "::error::No CHANGELOG section found for [$version], or the section is empty. Update CHANGELOG.md before tagging." >&2
            exit 1
          fi

          echo "--- release notes for ${TAG} ---"
          cat release-notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          tag="$TAG"
          # Pre-1.0: every release marked as a normal release (not pre-release).
          # GitHub auto-attaches source tarball + zip for the tag.
          gh release create "$tag" \
            --title "$tag" \
            --notes-file release-notes.md \
            --verify-tag
