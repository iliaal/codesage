version: 2

updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps
    ignore:
      # hf-hub 1.0 replaced the api::sync/Repo/Cache API that crates/embed/src/model.rs uses; it needs a manual port.
      - dependency-name: hf-hub
        update-types:
          - version-update:semver-major
      # crates/embed/Cargo.toml pins ort exactly in two target tables, and Dependabot rewrites only one, which breaks resolution.
      - dependency-name: ort
      # rmcp 3.6+ changes the malformed-frame log cause and frame-limit behavior that tests/mcp_daemon.rs and tests/mcp_framing.rs assert.
      - dependency-name: rmcp
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    cooldown:
      default-days: 7

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: ci
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    cooldown:
      default-days: 7
